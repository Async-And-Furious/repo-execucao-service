# DATABASE_URL (banco execucao_producao, role execucao_app, connection_limit=3) vem do Secrets Manager
# tc3-db-execucao-<env>, entregue pelo Epic #312. Os valores abaixo sao placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: execucao-secret
  namespace: execucao
type: Opaque
stringData:
  DATABASE_URL: ${database_url}
  JWT_PUBLIC_KEY: ${jwt_public_key}
  KAFKA_SASL_USERNAME: ${kafka_sasl_username}
  KAFKA_SASL_PASSWORD: ${kafka_sasl_password}
